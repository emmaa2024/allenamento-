<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scheda Glutei</title>

<style>
body {
    margin:0;
    background:#0a0a0f;
    color:#f0f0f0;
    font-family: Arial, sans-serif;
    padding:20px;
}
h1 {
    text-align:center;
}
.tabs {
    display:flex;
    gap:10px;
    margin-bottom:20px;
}
button {
    flex:1;
    padding:10px;
    border-radius:8px;
    border:none;
    cursor:pointer;
    font-weight:bold;
}
.activeA { background:#ec4899; color:white;}
.activeB { background:#a855f7; color:white;}
.activeC { background:#f59e0b; color:white;}

.card {
    background:#111;
    border-radius:10px;
    padding:12px;
    margin-bottom:10px;
    border-left:4px solid #ec4899;
}
.small {
    font-size:12px;
    color:#aaa;
}
</style>
</head>

<body>

<h1>Glutei · Addome · Gambe</h1>

<div class="tabs">
<button onclick="showWorkout('A')" id="btnA" class="activeA">Giorno A</button>
<button onclick="showWorkout('B')" id="btnB">Giorno B</button>
<button onclick="showWorkout('C')" id="btnC">Giorno C</button>
</div>

<div id="content"></div>

<script>

const workouts = {
A: [
["Hip Thrust", "4 serie", "12 rip"],
["Squat", "3 serie", "12 rip"],
["Bulgarian", "3 serie", "10 per gamba"],
["Abductor", "4 serie", "20 rip"],
["Leg Curl", "3 serie", "12 rip"]
],
B: [
["Elastico laterale", "3 serie", "15 passi"],
["Clamshell", "3 serie", "20 rip"],
["Kickback", "3 serie", "15 rip"],
["Crunch", "3 serie", "20 rip"],
["Plank", "3 serie", "25 sec"]
],
C: [
["Leg Press", "4 serie", "15 rip"],
["Affondi", "3 serie", "12 per gamba"],
["Abductor lento", "4 serie", "15 rip"],
["Stacchi rumeni", "3 serie", "12 rip"],
["Bicycle Crunch", "3 serie", "20 rip"]
]
};

function showWorkout(day) {
    const content = document.getElementById("content");
    content.innerHTML = "";

    document.getElementById("btnA").className="";
    document.getElementById("btnB").className="";
    document.getElementById("btnC").className="";

    document.getElementById("btn"+day).className="active"+day;

    workouts[day].forEach(e => {
        const div = document.createElement("div");
        div.className = "card";
        div.innerHTML = `
            <strong>${e[0]}</strong><br>
            <span class="small">${e[1]} · ${e[2]}</span>
        `;
        content.appendChild(div);
    });
}

showWorkout("A");

</script>

</body>
</html>
